<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5e57">
<title>RESET Site Assessment</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f4f6f5; --surface:#fff; --surface2:#eef1ef; --text:#18201e; --muted:#5d6966; --border:#d9dfdc;
  --accent:#0f5e57; --accent-ink:#fff; --accent-soft:#dcefeb;
  --good:#15803d; --good-soft:#dcf3e3; --mid:#b45309; --mid-soft:#fdf0d9; --bad:#b91c1c; --bad-soft:#fde4e4;
  --none:#64748b; --none-soft:#e8ecf1;
  --s1:#d64545; --s2:#e8833a; --s3:#d6a821; --s4:#7cb342; --s5:#2e8b57;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101514; --surface:#18201e; --surface2:#202a28; --text:#e6ecea; --muted:#9aa8a4; --border:#2d3a37;
    --accent:#3fb3a5; --accent-ink:#06201c; --accent-soft:#183a35;
    --good:#4ade80; --good-soft:#163524; --mid:#fbbf24; --mid-soft:#3a2d12; --bad:#f87171; --bad-soft:#3d1a1a;
    --none:#94a3b8; --none-soft:#252f37; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#101514; --surface:#18201e; --surface2:#202a28; --text:#e6ecea; --muted:#9aa8a4; --border:#2d3a37;
  --accent:#3fb3a5; --accent-ink:#06201c; --accent-soft:#183a35;
  --good:#4ade80; --good-soft:#163524; --mid:#fbbf24; --mid-soft:#3a2d12; --bad:#f87171; --bad-soft:#3d1a1a;
  --none:#94a3b8; --none-soft:#252f37; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(70px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
html[dir="rtl"] body{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Geeza Pro",system-ui,sans-serif;line-height:1.6}
header.top{position:sticky;top:0;z-index:40;background:var(--accent);color:var(--accent-ink);padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:52px}
header.top h1{font-size:16px;margin:0;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:12px;opacity:.85;font-weight:500}
.langbtn{appearance:none;border:1px solid rgba(255,255,255,.55);background:transparent;color:inherit;border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;font-weight:650;cursor:pointer;min-height:32px}
main{max-width:1000px;margin:0 auto;padding:16px}
main.full{max-width:none;padding:0}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:center;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:550;text-align:center}
nav.tabs a.on{color:var(--accent)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
html[dir="rtl"] .flip{transform:scaleX(-1)}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:15px;margin:18px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn svg.i{width:18px;height:18px}
.icon-btn{appearance:none;border:0;background:transparent;color:inherit;padding:6px;border-radius:8px;cursor:pointer;display:inline-flex}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:14px 16px}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 10px;width:100%;min-height:42px}
textarea{min-height:64px;resize:vertical}
input[type="url"],input[data-k="lat"],input[data-k="lng"]{direction:ltr}
html[dir="rtl"] input[type="url"]{text-align:right}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 4px}
.fld{margin-bottom:12px;min-width:0}
.fld .hint{font-size:12px;color:var(--muted);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr;gap:0 14px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}.fld.wide{grid-column:1/-1}}
.unitwrap{position:relative}
.unitwrap input{padding-inline-end:70px}
.unitwrap .u{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:2px 9px;border-radius:999px;background:var(--none-soft);color:var(--none);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.mid{background:var(--mid-soft);color:var(--mid)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
/* site list */
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.toolbar input,.toolbar select{flex:1;min-width:140px}
.sites{display:grid;gap:10px}
@media (min-width:760px){.sites{grid-template-columns:1fr 1fr}}
.site-card{display:flex;gap:12px;align-items:center;padding:12px 14px;text-align:start;width:100%;cursor:pointer;font:inherit;color:inherit}
.site-card:hover{border-color:var(--accent)}
.badge{flex:none;width:58px;height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface2);font-weight:750;font-size:18px;line-height:1}
.badge small{font-size:10px;font-weight:600;color:var(--muted);margin-top:3px}
.sc-body{flex:1;min-width:0}
.sc-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.bar{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:480px){.stat b{font-size:18px}.stat{padding:8px}}
/* editor */
.ed-head{display:flex;align-items:center;gap:8px;margin:-4px 0 10px}
.ed-title{flex:1;min-width:0}
.ed-title b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-title span{font-size:13px;color:var(--muted)}
.statusbar{position:sticky;top:52px;z-index:30;background:var(--bg);padding:8px 0 10px;margin-bottom:6px;border-bottom:1px solid var(--border)}
.statusbar .row{gap:6px}
.segtabs{display:flex;background:var(--surface2);border-radius:11px;padding:3px;margin-bottom:12px}
.segtabs button{flex:1;border:0;background:transparent;font:inherit;font-weight:650;color:var(--muted);padding:9px;border-radius:9px;cursor:pointer}
.segtabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
details.sec{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow)}
details.sec>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:10px;font-weight:650}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .letter{flex:none;width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
details.sec>summary .t{flex:1;min-width:0}
details.sec>summary .cnt{font-size:12px;color:var(--muted);font-weight:600}
details.sec>summary .cnt.done{color:var(--good)}
details.sec>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 0 0;margin-inline-end:4px;transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.sec-body{padding:2px 16px 14px}
.note{background:var(--accent-soft);color:var(--text);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.gps{background:var(--surface2);border-radius:12px;padding:12px;margin-bottom:12px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:8px 8px;border-bottom:1px solid var(--border);text-align:start;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:650;white-space:nowrap}
table.t td.n,table.t th.n{text-align:end;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.anchor-row{display:grid;grid-template-columns:1fr 120px 36px;gap:8px;margin-bottom:8px;align-items:center}
.ev-row{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--border)}
.ev-row:last-child{border-bottom:0}
@media (min-width:640px){.ev-row{grid-template-columns:1.3fr 150px 1fr;align-items:center}}
.ev-row .ev-t{font-weight:600;font-size:14px}
.ev-row .ev-d{font-size:12px;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.ph{background:var(--surface2);border-radius:10px;overflow:hidden;position:relative}
.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}
.ph .ph-b{padding:6px;display:grid;gap:5px}
.ph input,.ph select{min-height:34px;padding:5px 7px;font-size:13px}
.ev-att{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.ev-thumb{width:104px;position:relative}
.ev-thumb img{width:104px;height:78px;object-fit:cover;border-radius:8px;display:block;cursor:zoom-in;background:var(--surface2)}
.ev-thumb input{min-height:30px;padding:3px 6px;font-size:12px;margin-top:4px}
.ev-link{display:grid;grid-template-columns:1fr auto 36px;gap:6px;align-items:center;width:100%}
.ev-link a.disabled{pointer-events:none;opacity:.45}
.ev-btns{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.ev-thumb .x,.ph .x{position:absolute;top:5px;inset-inline-end:5px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:99px;width:28px;height:28px;cursor:pointer;font-size:16px;line-height:1}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.rv-row{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 0;border-bottom:1px solid var(--border)}
.rv-row:last-child{border-bottom:0}
@media (min-width:640px){.rv-row{grid-template-columns:1.2fr 170px 1.3fr;align-items:start}}
.rv-row .ev{font-size:12px;color:var(--muted);margin-top:3px}
.result-sel.Eligible{border-color:var(--good);color:var(--good);font-weight:650}
.result-sel.Ineligible{border-color:var(--bad);color:var(--bad);font-weight:650}
.result-sel.Pending{border-color:var(--mid);color:var(--mid);font-weight:650}
.score-row{display:grid;grid-template-columns:1fr 160px;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);align-items:center}
.score-row:last-child{border-bottom:0}
@media (max-width:520px){.score-row{grid-template-columns:1fr;gap:6px}.score-row>div[style*="text-align"]{text-align:start!important}}
.sugg{font-size:12px;color:var(--muted);margin-top:2px}
.bigscore{display:flex;align-items:baseline;gap:6px}
.bigscore b{font-size:32px;line-height:1}
.dot{display:inline-block;width:10px;height:10px;border-radius:99px;flex:none}
.sc{display:inline-flex;min-width:26px;justify-content:center;padding:2px 6px;border-radius:6px;font-weight:700;font-size:13px;color:#fff}
.sc.s0{background:var(--none)}.sc.s1{background:var(--s1)}.sc.s2{background:var(--s2)}.sc.s3{background:var(--s3)}.sc.s4{background:var(--s4)}.sc.s5{background:var(--s5)}
.sc.na{background:transparent;color:var(--muted)}
#map{height:calc(100dvh - 52px - 64px - env(safe-area-inset-bottom));width:100%;background:var(--surface2)}
.map-msg{padding:40px 16px;text-align:center;color:var(--muted)}
.legend{background:var(--surface);color:var(--text);padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.7;box-shadow:var(--shadow);border:1px solid var(--border)}
.leaflet-popup-content{font:14px/1.4 system-ui,Tahoma,sans-serif}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2725;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:999;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;border-radius:6px}
.settings-grid{display:grid;gap:12px}
@media (min-width:760px){.settings-grid{grid-template-columns:1fr 1fr}}
.wrow{display:grid;grid-template-columns:1fr 92px 64px;gap:8px;align-items:center;margin-bottom:8px}
.wrow .pct{font-size:13px;color:var(--muted);text-align:end;font-variant-numeric:tabular-nums}
.wrow .unitwrap input{padding-inline-end:28px;text-align:end}
.wrow.head{font-size:12px;color:var(--muted);font-weight:650;margin-bottom:4px}
.wrow.head span:not(:first-child){text-align:end}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
#report{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;color:#000;padding:0;font-size:10.5pt}
  body>*:not(#report){display:none!important}
  #report{display:block!important}
}
/* report */
#report{color:#111;font:10.5pt/1.45 "Segoe UI",Tahoma,Arial,sans-serif}
#report h1{font-size:20pt;margin:0 0 4px;color:#0f5e57}
#report h2{font-size:13pt;margin:18px 0 8px;color:#0f5e57;border-bottom:2px solid #0f5e57;padding-bottom:3px}
#report h3{font-size:11pt;margin:12px 0 6px;color:#0f5e57}
#report table{width:100%;border-collapse:collapse;margin-bottom:8px;page-break-inside:auto}
#report tr{page-break-inside:avoid}
#report th,#report td{border:1px solid #bbb;padding:4px 6px;text-align:start;vertical-align:top;font-size:9.5pt}
#report th{background:#e8f1ef}
#report td.k{width:38%;background:#f6f8f7;font-weight:600}
#report .pb{page-break-before:always}
#report .kicker{font-size:9pt;letter-spacing:.08em;text-transform:uppercase;color:#555}
#report .rp-photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#report .rp-photos figure{margin:0;page-break-inside:avoid}
#report .rp-photos img{width:100%;max-height:70mm;object-fit:cover;border:1px solid #ccc}
#report figcaption{font-size:8.5pt;color:#444}
#report .box{border:1px solid #0f5e57;background:#eef6f4;padding:8px 10px;margin:8px 0}
#report a{word-break:break-all}
</style>
</head>
<body>
<header class="top">
  <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <h1 id="appTitle">RESET Site Assessment</h1>
  <span class="sub" id="saveState"></span>
  <button class="langbtn" id="langBtn" data-action="lang" lang="ar">العربية</button>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <a href="#sites" data-tab="sites"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span data-i18n="Sites">Sites</span></a>
  <a href="#map" data-tab="map"><svg class="i" viewBox="0 0 24 24"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4zM9 4v13.5M15 6.5V20"/></svg><span data-i18n="Map">Map</span></a>
  <a href="#register" data-tab="register"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg><span data-i18n="Register">Register</span></a>
  <a href="#settings" data-tab="settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span data-i18n="Method & data">Method &amp; data</span></a>
</nav>
<div id="lightbox"><img alt=""></div>
<div id="report"></div>

<script>
'use strict';
/* ================= Arabic dictionary (keys are the English UI text) ================= */
const AR={
"RESET Site Assessment":"تقييم مواقع RESET",
"RESET Mini-Grid Site Screening":"فحص مواقع الشبكات المصغّرة – RESET",
"Yemen":"اليمن",
"Sites":"المواقع","Map":"الخريطة","Register":"السجل","Method & data":"المنهجية والبيانات",
"Saving…":"جارٍ الحفظ…","Saved":"تم الحفظ","Not saved (no storage)":"لم يُحفظ (لا توجد مساحة تخزين)","Save failed":"فشل الحفظ","Could not save: {0}":"تعذّر الحفظ: {0}",
"Language":"اللغة",
/* criteria */
"Household / village dispersion":"تشتّت المساكن / القرية",
"Household electricity payment":"مدفوعات الكهرباء للأسر",
"Commercial electricity payment":"مدفوعات الكهرباء التجارية",
"Rehabilitable infrastructure":"البنية التحتية القابلة لإعادة التأهيل",
"Annex {0}":"الملحق {0}",
/* eligibility */
"Security and access":"الأمن وإمكانية الوصول",
"Reasonably secure location in IRG-controlled territory, away from active frontlines, with safe year-round construction and O&M access.":"موقع آمن بدرجة معقولة ضمن مناطق سيطرة الحكومة المعترف بها دولياً، بعيداً عن خطوط المواجهة النشطة، مع وصول آمن طوال العام لأعمال الإنشاء والتشغيل والصيانة.",
"IRG-controlled":"ضمن مناطق سيطرة الحكومة","Distance to frontline":"المسافة إلى خط المواجهة","Incidents (2 yrs)":"الحوادث (سنتان)","Route":"الطريق","Passability":"إمكانية العبور",
"No conflicting public electrification":"عدم وجود كهربة عامة متعارضة",
"No confirmed Government plan for grid extension or other publicly financed supply that conflicts with the mini-grid, plus confirmation / no-objection from the competent authority.":"لا توجد خطة حكومية مؤكدة لتمديد الشبكة أو أي إمداد ممول من القطاع العام يتعارض مع الشبكة المصغّرة، مع تأكيد / عدم ممانعة من الجهة المختصة.",
"Grid extension planned":"تمديد الشبكة مخطط","Other public electrification":"كهربة عامة أخرى","Govt confirmation":"التأكيد الحكومي","Grid distance":"المسافة إلى الشبكة",

let LANG='en';

const MISSING=new Set();
const has=k=>Object.prototype.hasOwnProperty.call(AR,k);
function t(s,...a){let r=s;if(LANG==='ar'){if(has(s))r=AR[s];else MISSING.add(s)}a.forEach((v,i)=>{r=r.split('{'+i+'}').join(String(v))});return r}
const tv=v=>(LANG==='ar'&&v!=null&&has(v))?AR[v]:v;   // translate a stored value if it is a known option
function applyLang(){
  const h=document.documentElement;h.lang=LANG;h.dir=LANG==='ar'?'rtl':'ltr';
  const b=$('#langBtn');b.textContent=LANG==='ar'?'English':'العربية';b.lang=LANG==='ar'?'en':'ar';
  $$('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.title=t('RESET Site Assessment');
}
function setLang(l){LANG=l==='ar'?'ar':'en';try{localStorage.setItem('rsa.lang',LANG)}catch(e){}applyLang();route()}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const et=(s,...a)=>esc(t(s,...a));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const num=v=>{if(v===null||v===undefined||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return Number.isFinite(n)?n:null};
const today=()=>new Date().toISOString().slice(0,10);
const fmt=(n,d=2)=>n==null?'—':Number(n).toFixed(d).replace(/\.?0+$/,'')||'0';
function toast(msg,ms=2600){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),ms)}
function setPath(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null||typeof a[ks[i]]!=='object')a[ks[i]]={};a=a[ks[i]]}a[ks[ks.length-1]]=v}
function download(content,type,name){const b=content instanceof Blob?content:new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
const slug=s=>String(s||'export').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'export';

/* ================= storage (IndexedDB, memory fallback) ================= */
const DB={db:null,mem:{meta:{},sites:{}},
  open(){return new Promise(res=>{try{const r=indexedDB.open('reset-site-assessment',1);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta');if(!d.objectStoreNames.contains('sites'))d.createObjectStore('sites',{keyPath:'id'})};
    r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
  run(store,mode,fn){return new Promise((res,rej)=>{const tx=this.db.transaction(store,mode);const q=fn(tx.objectStore(store));tx.oncomplete=()=>res(q?q.result:undefined);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})},
  get(store,key){return this.db?this.run(store,'readonly',s=>s.get(key)):Promise.resolve(this.mem[store][key])},
  put(store,val,key){if(!this.db){this.mem[store][key??val.id]=val;return Promise.resolve()}return this.run(store,'readwrite',s=>key!==undefined?s.put(val,key):s.put(val))},
  del(store,key){if(!this.db){delete this.mem[store][key];return Promise.resolve()}return this.run(store,'readwrite',s=>s.delete(key))},
  all(store){return this.db?this.run(store,'readonly',s=>s.getAll()):Promise.resolve(Object.values(this.mem[store]))},
  clear(store){if(!this.db){this.mem[store]={};return Promise.resolve()}return this.run(store,'readwrite',s=>s.clear())}
};

/* ================= scoring ================= */
function payScore(v){if(v==null)return null;const b=cfg.payBands;if(v<b[0])return 1;if(v<=b[1])return 2;if(v<b[2])return 3;if(v<=b[3])return 4;return 5}
function avg2(a,b){a=num(a);b=num(b);if(a==null&&b==null)return null;if(a==null)return b;if(b==null)return a;return (a+b)/2}
function dispScore(r,layout){if(layout==='Several widely separated clusters')return 1;r=num(r);if(r==null)return null;const b=cfg.dispBands;if(r<=b[0])return 5;if(r<=b[1])return 4;if(r<=b[2])return 3;if(r<=b[3])return 2;return 1}
function anchorScore(x){if(x==null)return null;if(x<=0)return 0;const b=cfg.anchorBands;if(x<=b[0])return 1;if(x<=b[1])return 2;if(x<=b[2])return 3;if(x<=b[3])return 4;return 5}
function rehabSuggest(c,present){if(present==='No'||c==='None'||(c||'').startsWith('Poor'))return 1;if((c||'').startsWith('Largely intact'))return 5;return null}
function derive(s){
  const f=s.f, rv=s.rv;
  const hhAvg=avg2(f.hhPayMin,f.hhPayMax), comAvg=avg2(f.comPayMin,f.comPayMax);
  const at=s.anchors.length?s.anchors.reduce((a,x)=>a+(num(x.kwh)||0),0):(f.noAnchor?0:null);
  const sugg={disp:dispScore(f.radiusKm,f.layout),hhpay:payScore(hhAvg),compay:payScore(comAvg),rehab:rehabSuggest(f.infraCond,f.infraPresent)};
  const final={},confirmed={};
  for(const c of CRIT){const v=num(rv.scores[c.k]);confirmed[c.k]=v!=null;final[c.k]=v!=null?v:sugg[c.k]}
  let wsum=0,acc=0,complete=true;
  for(const c of CRIT){const w=num(cfg.weights[c.k])||0;if(final[c.k]==null){if(w>0)complete=false;continue}wsum+=w;acc+=w*final[c.k]}
  const wscore=complete&&wsum>0?acc/wsum:null;
  const res=ELIG.map(e=>(rv.elig[e.k]||{}).r||'');
  let elig='Not reviewed';
  if(res.some(r=>r==='Ineligible'))elig='Ineligible';
  else if(res.every(r=>r==='Eligible'))elig='Eligible';
  else if(res.some(r=>r))elig='Pending';
  const req=ALL_FIELDS.filter(x=>!x.opt);
  let filled=req.filter(x=>x.type==='chk'?!!f[x.k]:String(f[x.k]??'').trim()!=='').length;
  const total=req.length+1; if(num(f.lat)!=null&&num(f.lng)!=null)filled++;
  return {hhAvg,comAvg,anchorTotal:at,anchorRef:anchorScore(at),sugg,final,confirmed,wscore,elig,
    complete:filled/total,conn:num(f.hhConn),es:f.esCat||'',fieldStatus:f.submitted?'Submitted':'Draft'};
}
function rankAll(){
  const rows=sites.map(s=>({s,d:derive(s)}));
  const order={'Eligible':0,'Pending':1,'Not reviewed':2,'Ineligible':3};
  rows.sort((a,b)=>(order[a.d.elig]-order[b.d.elig])||((b.d.wscore??-1)-(a.d.wscore??-1))||String(a.s.f.siteId).localeCompare(String(b.s.f.siteId)));
  let r=0;for(const x of rows)x.rank=(x.d.elig==='Eligible'&&x.d.wscore!=null)?++r:null;
  return rows;
}

let saveTimer=null,pending=null;
function scheduleSave(s){pending=s;clearTimeout(saveTimer);$('#saveState').textContent=t('Saving…');saveTimer=setTimeout(flushSave,400)}
async function flushSave(){clearTimeout(saveTimer);if(!pending)return;const s=pending;pending=null;
  try{await DB.put('sites',s);$('#saveState').textContent=DB.db?t('Saved'):t('Not saved (no storage)')}catch(e){$('#saveState').textContent=t('Save failed');toast(t('Could not save: {0}',(e&&e.message)||e))}}

/* ================= router ================= */
function go(h){if(location.hash==='#'+h)route();else location.hash=h}
async function route(){
  await flushSave();stopGPS();
  if(map){map.remove();map=null}
  const h=decodeURIComponent(location.hash.slice(1))||'sites';
  const main=$('#main');main.className='';
  if(h.startsWith('site/')){
    cur=sites.find(s=>s.id===h.slice(5));
    if(!cur){location.hash='sites';return}
    view='edit';renderEditor();
  }else{
    cur=null;view=['sites','map','register','settings'].includes(h)?h:'sites';
    if(view==='sites')renderSites();
    else if(view==='map')renderMap();
    else if(view==='register')renderRegister();
    else renderSettings();
  }
  $$('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.tab===(view==='edit'?'sites':view)));
  $('#appTitle').textContent=projName();
}

function optionsHTML(opts,v){return opts.map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(tv(o))}</option>`).join('')+(v&&!opts.includes(v)?`<option value="${esc(v)}" selected>${esc(tv(v))}</option>`:'')}
function inputHTML(x,val){
  const v=val??'';
  const id='f_'+x.k;
  if(x.type==='sel')return `<select id="${id}" data-k="${x.k}"><option value="">—</option>${optionsHTML(x.o,v)}</select>`;
  if(x.type==='ta')return `<textarea id="${id}" data-k="${x.k}" rows="2">${esc(v)}</textarea>`;
  if(x.type==='date')return `<input id="${id}" type="date" data-k="${x.k}" value="${esc(v)}">`;
  if(x.type==='num')return `<div class="unitwrap"><input id="${id}" type="number" inputmode="decimal" step="any" data-k="${x.k}" value="${esc(v)}">${x.u?`<span class="u">${et(x.u)}</span>`:''}</div>`;
  if(x.type==='chk')return `<label class="row" style="font-weight:600"><input type="checkbox" data-k="${x.k}" ${v?'checked':''} style="width:22px;min-height:22px"> ${et(x.l)}</label>`;
  return `<input id="${id}" type="text" data-k="${x.k}" value="${esc(v)}">`;
}
function secCount(s,sec){
  const fs=sec.f.filter(x=>x.k&&!x.opt);let n=fs.length,d=fs.filter(x=>x.type==='chk'?!!s.f[x.k]:String(s.f[x.k]??'').trim()!=='').length;
  if(sec.f.some(x=>x.gps)){n++;if(num(s.f.lat)!=null&&num(s.f.lng)!=null)d++}
  if(sec.f.some(x=>x.anchors)){n++;if(s.anchors.length||s.f.noAnchor)d++}

function setGpsLabel(){const l=$('#gpsLbl');if(l)l.textContent=watchId!==null?t('Stop GPS'):t('Capture GPS')}
function startGPS(){
  if(!navigator.geolocation){toast(t('GPS is not available on this device'));return}
  if(watchId!==null){stopGPS();return}
  let best=null;const t0=Date.now();
  watchId=navigator.geolocation.watchPosition(p=>{
    const c=p.coords;
    if(!best||c.accuracy<best.accuracy){
      best=c;lastFix={lat:c.latitude,lng:c.longitude,acc:c.accuracy,t:Date.now()};
      if(cur){cur.f.lat=c.latitude.toFixed(6);cur.f.lng=c.longitude.toFixed(6);cur.f.acc=Math.round(c.accuracy);if(c.altitude!=null)cur.f.alt=Math.round(c.altitude);
        for(const k of ['lat','lng','acc','alt']){const el=$('#f_'+k);if(el)el.value=cur.f[k]??''}
        touched()}
    }
    const gi=$('#gpsInfo');if(gi)gi.textContent=t('± {0} m – improving…',Math.round(best.accuracy));
    if(best.accuracy<=5||Date.now()-t0>30000)stopGPS();
  },err=>{toast(t('GPS: {0}',err.message));stopGPS()},{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  setGpsLabel();
  setTimeout(()=>{if(watchId!==null&&Date.now()-t0>=30000)stopGPS()},31000);
}
function stopGPS(){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
  setGpsLabel();
  const gi=$('#gpsInfo');if(gi&&cur&&cur.f.acc)gi.textContent=t('± {0} m accuracy',cur.f.acc);
}

function compress(file,max=1400,q=.72){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error(t('Could not read image')))};img.src=url})}
async function addPhotos(files,ev){
  if(!cur)return;const s=cur;
  const evd=EVIDENCE.find(e=>e.k===ev), isDoc=evd&&ev!=='photos';
  for(const f of files){try{const data=await compress(f,isDoc?1800:1400,isDoc?.8:.72);
    const fix=lastFix&&Date.now()-lastFix.t<10*60*1000?lastFix:null;
    s.photos.push({id:uid(),data,caption:'',cat:isDoc?evd.n:'Site / location',ev:ev||null,t:Date.now(),lat:fix?fix.lat:null,lng:fix?fix.lng:null})}catch(e){toast(e.message)}}
  if(cur===s){if(ev)refreshAtt(ev);else{const g=$('#photoGrid');if(g)g.innerHTML=photoGridHTML(s);refreshAtt('photos')}touched()}
}

function bandProblems(){
  const msgs=[];
  for(const [k,n] of [['payBands','Payment bands'],['dispBands','Dispersion bands'],['anchorBands','Anchor-load bands']]){
    const b=cfg[k];
    if(b.some(v=>v<0))msgs.push(t('{0}: values cannot be negative.',t(n)));
    else if(b.some((v,i)=>i&&v<=b[i-1]))msgs.push(t('{0}: each value must be larger than the one before.',t(n)));
  }
  if(CRIT.some(c=>(num(cfg.weights[c.k])||0)<0))msgs.push(t('Weights cannot be negative.'));
  return msgs.length?'⚠ '+msgs.join(' ')+' '+t('Scores will be wrong until this is fixed.'):'';
}

async function importFile(file){
  let data;try{data=JSON.parse(await file.text())}catch(e){toast(t('That file is not a valid backup'));return}
  if(!data||data.app!=='reset-site-assessment'||!Array.isArray(data.sites)){toast(t('That file is not a RESET site assessment backup'));return}
  let added=0,updated=0,kept=0;
  for(const raw of data.sites){if(!raw||!raw.id)continue;const s=ensure(raw);const ex=sites.find(x=>x.id===s.id);
    if(!ex){sites.push(s);await DB.put('sites',s);added++}
    else if((s.updatedAt||0)>(ex.updatedAt||0)){Object.assign(ex,s);await DB.put('sites',ex);updated++}else kept++}
  if(data.cfg&&confirm(t("Also replace this device's weights and scoring bands with those in the backup?"))){cfg={...structuredClone(DEFAULT_CFG),...data.cfg};await DB.put('meta',cfg,'cfg')}
  toast(t('Imported: {0} new, {1} updated, {2} unchanged',added,updated,kept),4000);route();
}

  let h=`<div class="kicker">${et('Site Register & Screening report · {0}',countryName())}</div><h1>${esc(projName())}</h1>
   <p>${et('Generated {0} · {1} candidate sites · {2} eligible · {3} pending / not reviewed · {4} ineligible',new Date().toLocaleString(locale()),rows.length,cnt('Eligible'),cnt('Pending')+cnt('Not reviewed'),cnt('Ineligible'))}</p>
   <h2>${et('1. Ranking of eligible sites')}</h2>
   <table><tr><th>${et('Rank')}</th><th>${et('Site ID')}</th><th>${et('Settlement')}</th><th>${et('District')}</th><th>${et('Disp.')}</th><th>${et('HH pay')}</th><th>${et('Com. pay')}</th><th>${et('Rehab')}</th><th>${et('Weighted (/5)')}</th><th>${et('Anchor ref')}</th><th>${et('HH conn.')}</th><th>${et('E&S')}</th></tr>
   ${rows.filter(r=>r.rank).map(({s,d,rank})=>`<tr><td>${rank}</td><td>${esc(s.f.siteId)}</td><td>${esc(s.f.name)}</td><td>${esc(s.f.district)}</td>${CRIT.map(c=>`<td>${d.final[c.k]??'—'}</td>`).join('')}<td><b>${d.wscore.toFixed(2)}</b></td><td>${d.anchorRef??'—'}</td><td>${d.conn??'—'}</td><td>${val(d.es)}</td></tr>`).join('')||`<tr><td colspan="12">${et('No sites are yet eligible with complete scores.')}</td></tr>`}</table>
   <h2>${et('2. Eligibility screening')}</h2>
   <table><tr><th>${et('Site ID')}</th><th>${et('Settlement')}</th>${ELIG.map(e=>`<th>${et(e.n)}</th>`).join('')}<th>${et('Overall')}</th></tr>
   ${rows.map(({s,d})=>`<tr><td>${esc(s.f.siteId)}</td><td>${esc(s.f.name)}</td>${ELIG.map(e=>`<td>${val((s.rv.elig[e.k]||{}).r)}</td>`).join('')}<td><b>${et(d.elig)}</b></td></tr>`).join('')}</table>
   <h2>${et('3. Method')}</h2>
   <p>${t('Sites are screened against five minimum eligibility requirements (§2.3). A site is <b>Eligible</b> only when all five are met, <b>Ineligible</b> when any is not met, and <b>Pending</b> where information is insufficient. Eligible sites are compared on four weighted criteria scored 1–5 (§2.4): dispersion {0}%, household payment {1}%, commercial payment {2}%, rehabilitable infrastructure {3}%. The anchor-load score (Annex A) and potential household connections are recorded for reference and are not weighted.',W.disp,W.hhpay,W.compay,W.rehab)}</p>
   <table><tr><th>${et('Band')}</th><th>${et('Values')}</th></tr>
    <tr><td>${et('Payment (Annex B/C, USD/kWh, average of min & max)')}</td><td dir="ltr">1: &lt;${P[0]} · 2: ${P[0]}–${P[1]} · 3: &gt;${P[1]} – &lt;${P[2]} · 4: ${P[2]}–${P[3]} · 5: &gt;${P[3]}</td></tr>
    <tr><td>${et('Dispersion (Annex D, km centre to outer edge)')}</td><td>5: ≤${D[0]} · 4: ≤${D[1]} · 3: ≤${D[2]} · 2: ≤${D[3]} · 1: &gt;${D[3]} ${et('or several widely separated clusters')}</td></tr>
    <tr><td>${et('Anchor load (Annex A, kWh/day)')}</td><td>0: ${et('none')} · 1: ≤${A[0]} · 2: ≤${A[1]} · 3: ≤${A[2]} · 4: ≤${A[3]} · 5: &gt;${A[3]}</td></tr>
    <tr><td>${et('Rehabilitable infrastructure (Annex E)')}</td><td>${et('1: weak · 2–4: intermediate, by technical judgement · 5: strong')}</td></tr></table>`;
  if(full)rows.forEach(({s})=>{h+=siteReportHTML(s,false)});
  printHTML(h);
}

/* ================= offline install (service worker) ================= */
let installEvt=null, swReady=false, swFailed=false;
const swSupported=()=>'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1');
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function offlineText(){
  if(!swSupported())return t('Offline use needs the app to be opened from its https web address.');
  if(swFailed)return t('This browser could not set up offline use. Open the app in Chrome or Edge.');
  const base=swReady?t('Ready to work offline. The map only shows areas already viewed online.'):t('Preparing offline use… keep this page open for a moment while online.');
  return isStandalone()?t('Installed – opens from the home screen.')+' '+base:base;
}
function refreshOffline(){
  const o=$('#offlineInfo');if(o)o.textContent=offlineText();
  const b=$('#installBtn');if(b)b.style.display=installEvt?'':'none';
  const h=$('#installHint');if(h)h.style.display=installEvt||isStandalone()?'none':'';
}
if(swSupported()){
  navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{swReady=true;refreshOffline()}).catch(()=>{swFailed=true;refreshOffline()});
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;refreshOffline()});
window.addEventListener('appinstalled',()=>{installEvt=null;refreshOffline()});

/* ================= events ================= */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action;
  if(a==='lang'){setLang(LANG==='ar'?'en':'ar')}
  else if(a==='install'){if(installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(_){}installEvt=null;refreshOffline()}}
  else if(a==='new-site'||a==='new-at'){const s=newSite();if(a==='new-at'){s.f.lat=el.dataset.lat;s.f.lng=el.dataset.lng;s.f.acc=''}
    sites.push(s);await DB.put('sites',s);openSecs.clear();openSecs.add('A');etab='field';go('site/'+s.id)}
  else if(a==='open'){etab='field';go('site/'+el.dataset.id)}
  else if(a==='back'){history.length>1?history.back():go('sites')}
  else if(a==='del-site'){if(!cur)return;if(!confirm(t('Delete {0} and its photos from this device? This cannot be undone.',siteLabel(cur))))return;
    const id=cur.id;pending=null;await DB.del('sites',id);sites=sites.filter(s=>s.id!==id);cur=null;toast(t('Site deleted'));go('sites')}
  else if(a==='etab'){etab=el.dataset.t;renderEditor()}
  else if(a==='gps')startGPS();
  else if(a==='add-anchor'){cur.anchors.push({id:uid(),desc:'',kwh:''});cur.f.noAnchor=false;rerenderSection('C');touched();const ins=$$('#anchorList input[data-ak="desc"]');if(ins.length)ins[ins.length-1].focus()}
  else if(a==='del-anchor'){cur.anchors=cur.anchors.filter(x=>x.id!==el.dataset.a);rerenderSection('C');touched()}
  else if(a==='del-photo'){if(!confirm(t('Delete this photo?')))return;const p=cur.photos.find(x=>x.id===el.dataset.p);cur.photos=cur.photos.filter(x=>x.id!==el.dataset.p);
    refreshAtt(p&&p.ev&&p.ev!=='photos'?p.ev:'photos');touched()}
  else if(a==='add-link'){const ev=el.dataset.ev;const l={id:uid(),ev,url:''};cur.links.push(l);refreshAtt(ev);touched();const inp=$(`[data-link="${l.id}"]`);if(inp)inp.focus()}
  else if(a==='del-link'){const l=cur.links.find(x=>x.id===el.dataset.l);cur.links=cur.links.filter(x=>x.id!==el.dataset.l);if(l)refreshAtt(l.ev);touched()}
  else if(a==='zoom'){const lb=$('#lightbox');lb.querySelector('img').src=el.src;lb.style.display='flex'}
  else if(a==='print-site')printSite();
  else if(a==='print-all')printAll();
  else if(a==='csv')exportCSV();
  else if(a==='backup')backup();
  else if(a==='reset-cfg'){if(!confirm(t('Reset weights and scoring bands to the RESET initial framework?')))return;const keep={projectName:cfg.projectName,country:cfg.country,idPrefix:cfg.idPrefix};cfg={...structuredClone(DEFAULT_CFG),...keep};await DB.put('meta',cfg,'cfg');renderSettings()}
  else if(a==='wipe'){if(!confirm(t('Permanently delete ALL sites and photos on this device? Download a backup first if you need the data. This cannot be undone.')))return;
    if(prompt(t('Type DELETE to confirm'))!=='DELETE')return;await DB.clear('sites');sites=[];toast(t('All data deleted'));go('sites')}
});
$('#lightbox').addEventListener('click',()=>{$('#lightbox').style.display='none'});
function rerenderSection(id){
  const det=$(`details[data-sec="${id}"]`);if(!det)return;
  const tmp=document.createElement('div');
  openSecs.add(id);tmp.innerHTML=fieldHTML(cur);const fresh=tmp.querySelector(`details[data-sec="${id}"]`);det.replaceWith(fresh);
}
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details[data-sec]')){d.open?openSecs.add(d.dataset.sec):openSecs.delete(d.dataset.sec)}},true);
function onField(e){
  const el=e.target;
  if(el.type==='file'){
    if(e.type!=='change')return;
    if(el.dataset.photo){addPhotos([...el.files],el.dataset.ev||null);el.value=''}
    else if(el.dataset.import){if(el.files[0])importFile(el.files[0]);el.value=''}
    return;
  }
  if(el.id==='langSel'){if(e.type==='change')setLang(el.value);return}
  if(el.id==='q'){filterText=el.value;drawSiteList();return}
  if(el.id==='fe'){filterElig=el.value;drawSiteList();return}
  if(el.dataset.cfg!==undefined){let v=el.value;if(el.dataset.num){v=num(v);if(v==null)return}setPath(cfg,el.dataset.cfg,v);saveCfg();
    if(el.dataset.cfg.startsWith('weights'))refreshWeights();
    const bw=$('#bandWarn');if(bw)bw.textContent=bandProblems();
    const ps=$('#paySummary');if(ps)ps.innerHTML=paySummary();
    if(el.dataset.cfg==='projectName')$('#appTitle').textContent=projName();return}
  if(!cur)return;
  if(el.dataset.k!==undefined){
    const k=el.dataset.k;cur.f[k]=el.type==='checkbox'?el.checked:el.value;
    if(k==='surveyor'){try{localStorage.setItem('rsa.surveyor',el.value)}catch(_){}}
    touched();
  }else if(el.dataset.ak){const a=cur.anchors.find(x=>x.id===el.dataset.anchor);if(a){a[el.dataset.ak]=el.value;touched()}}
  else if(el.dataset.rv){setPath(cur.rv,el.dataset.rv,el.type==='checkbox'?el.checked:el.value);touched()}
  else if(el.dataset.link){const l=cur.links.find(x=>x.id===el.dataset.link);if(l){l.url=el.value.trim();const u=safeUrl(l.url);const o=$(`[data-linkopen="${l.id}"]`);if(o){o.href=u||'#';o.classList.toggle('disabled',!u)}
      if(e.type==='change'&&l.url&&!u)toast(t('Links must start with https://'));
      if(u&&!cur.f['ev_'+l.ev]){cur.f['ev_'+l.ev]='Collected';const sel=$('#evs_'+l.ev);if(sel)sel.value='Collected'}touched()}}
  else if(el.dataset.pcap){const p=cur.photos.find(x=>x.id===el.dataset.pcap);if(p){p.caption=el.value;touched()}}
  else if(el.dataset.pcat){const p=cur.photos.find(x=>x.id===el.dataset.pcat);if(p){p.cat=el.value;touched()}}
}
document.addEventListener('input',onField);
document.addEventListener('change',e=>{const el=e.target;if(el.type==='file'||el.tagName==='SELECT'||el.type==='checkbox'||el.type==='date'||el.dataset.link)onField(e)});
window.addEventListener('hashchange',route);
// stop the mouse wheel from silently changing a focused number field
document.addEventListener('wheel',e=>{const a=document.activeElement;if(a&&a.type==='number'&&a.contains(e.target))a.blur()},{passive:true});
window.addEventListener('pagehide',()=>{flushSave()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSave()});

/* ================= boot ================= */
(async function(){
  applyLang();
  const ok=await DB.open();
  if(!ok)toast(t('Device storage is unavailable – data will not be kept after closing.'),6000);
  try{const c=await DB.get('meta','cfg');if(c)cfg={...structuredClone(DEFAULT_CFG),...c,weights:{...DEFAULT_CFG.weights,...(c.weights||{})}}}catch(e){}
  try{sites=(await DB.all('sites')).map(ensure)}catch(e){sites=[]}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  route();
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" async onload="if(view==='map'&&!map)renderMap()"></script>
</body>
